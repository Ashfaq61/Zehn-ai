name: Zehn AI V4.0 Autonomous Build & Release Engine

on:
  push:
    branches:
      - main
      - 'zehn-auto/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - 'zehn-auto/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify_and_build:
    name: Test, Lint, Dependency Audit & Signed APK Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Set up Gradle (wrapper-independent)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare debug keystore if missing
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "$DEBUG_KEYSTORE_BASE64" | base64 --decode > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Compute Release Version Metadata
        id: ver
        run: |
          RUN_CODE=$((100 + GITHUB_RUN_NUMBER))
          TAG_NAME="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "version_name=4.0.$RUN_CODE" >> "$GITHUB_OUTPUT"
          fi
          echo "version_code=$RUN_CODE" >> "$GITHUB_OUTPUT"

      - name: Check Dependencies, Unit Tests & Lint
        run: |
          GRADLE_CMD="gradle"
          if [ -x "./gradlew" ]; then GRADLE_CMD="./gradlew"; fi
          $GRADLE_CMD :app:dependencies --configuration releaseRuntimeClasspath > build-dependencies.txt
          $GRADLE_CMD testDebugUnitTest lintDebug assembleDebug \
            -PZEHN_VERSION_CODE=${{ steps.ver.outputs.version_code }} \
            -PZEHN_VERSION_NAME=${{ steps.ver.outputs.version_name }} \
            --stacktrace | tee gradle-build.log

      - name: Verify Package Name & Debug APK
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -maxdepth 1 -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ] || [ ! -s "$APK_PATH" ]; then
            echo "Debug APK was not generated or is empty."
            exit 1
          fi
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort -V | tail -n 1)
          if [ -n "$AAPT2" ]; then
            BADGING=$("$AAPT2" dump badging "$APK_PATH" | head -n 2)
            echo "$BADGING"
            echo "$BADGING" | grep -q "name='com.zehn.assistant'"
          fi
          ls -lh "$APK_PATH"
          sha256sum "$APK_PATH" | tee apk-checksums.txt

      - name: Upload Test, Lint & Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zehn-v4-build-logs-and-reports
          path: |
            gradle-build.log
            build-dependencies.txt
            apk-checksums.txt
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.*
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Verified Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: zehn-ai-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Check Release Signing Secrets
        id: release_signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          B64="${RELEASE_KEYSTORE_BASE64:-$KEYSTORE_BASE64}"
          if [ -n "$B64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$B64" | base64 --decode > my-upload-key.jks
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "Release signing secrets not configured; skipping signed release APK."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Signed Release APK
        if: steps.release_signing.outputs.enabled == 'true'
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          GRADLE_CMD="gradle"
          if [ -x "./gradlew" ]; then GRADLE_CMD="./gradlew"; fi
          $GRADLE_CMD assembleRelease \
            -PZEHN_VERSION_CODE=${{ steps.ver.outputs.version_code }} \
            -PZEHN_VERSION_NAME=${{ steps.ver.outputs.version_name }} \
            --stacktrace

      - name: Cleanup Release Keystore
        if: always() && steps.release_signing.outputs.enabled == 'true'
        run: rm -f my-upload-key.jks

      - name: Upload Signed Release APK
        if: steps.release_signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: zehn-ai-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish Verified GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v') && success()
        uses: softprops/action-gh-release@v2
        with:
          name: Zehn AI ${{ github.ref_name }}
          body: |
            Verified automated APK release built by GitHub Actions.
            - versionCode: ${{ steps.ver.outputs.version_code }}
            - versionName: ${{ steps.ver.outputs.version_name }}
            - Previous releases remain intact for rollback (`overwrite_files: false`).
          generate_release_notes: true
          overwrite_files: false
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            apk-checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
