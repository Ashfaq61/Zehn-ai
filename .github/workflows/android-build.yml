name: Zehn AI Android CI & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Optional extra release notes for summary'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build_test_and_release:
    name: Build, Test & Validate Zehn AI APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Bootstrap Gradle Wrapper if missing
        run: |
          if [ ! -f ./gradlew ]; then
            gradle wrapper --gradle-version 9.3.1
          fi
          chmod +x ./gradlew

      - name: Verify Gradle dependencies
        run: ./gradlew :app:dependencies --configuration debugRuntimeClasspath > /dev/null

      - name: Run clean unit tests and build Debug APK
        run: ./gradlew clean test assembleDebug

      - name: Validate Debug APK metadata and architecture
        id: validate_debug
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -s "$APK" ]; then
            echo "ERROR: Debug APK missing or empty at $APK"
            exit 1
          fi
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort -V | tail -n 1)
          BADGING=$("$AAPT2" dump badging "$APK")
          echo "$BADGING" | head -n 30
          echo "$BADGING" | grep -q "package: name='com.zehn.assistant'" || { echo "ERROR: Unexpected package name"; exit 1; }
          echo "$BADGING" | grep -q "sdkVersion:'24'" || { echo "ERROR: Expected minSdk 24"; exit 1; }
          echo "$BADGING" | grep -q "targetSdkVersion:'35'" || { echo "ERROR: Expected targetSdk 35"; exit 1; }

          VERSION_NAME=$(echo "$BADGING" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          VERSION_CODE=$(echo "$BADGING" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")
          APK_BYTES=$(stat -c%s "$APK")
          APK_MB=$(awk "BEGIN {printf \"%.2f\", $APK_BYTES/1048576}")
          APK_SHA256=$(sha256sum "$APK" | awk '{print $1}')
          BUILD_DATE=$(date -u +"%Y-%m-%d %H:%M UTC")

          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "debug_apk_mb=$APK_MB" >> "$GITHUB_OUTPUT"
          echo "debug_apk_sha256=$APK_SHA256" >> "$GITHUB_OUTPUT"
          echo "build_date=$BUILD_DATE" >> "$GITHUB_OUTPUT"

      - name: Check signing secrets availability
        id: signing_check
        env:
          HAS_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
          HAS_STORE_PASS: ${{ secrets.STORE_PASSWORD != '' }}
          HAS_KEY_PASS: ${{ secrets.KEY_PASSWORD != '' }}
        run: |
          if [ "$HAS_KEYSTORE" = "true" ] && [ "$HAS_STORE_PASS" = "true" ] && [ "$HAS_KEY_PASS" = "true" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Signing secrets not configured; skipping signed release APK."
          fi

      - name: Build and validate Signed Release APK
        if: steps.signing_check.outputs.configured == 'true'
        id: build_release
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          KEYSTORE_PATH="${{ runner.temp }}/release-upload.jks"
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          export KEYSTORE_PATH
          ./gradlew assembleRelease
          REL_APK="app/build/outputs/apk/release/app-release.apk"
          if [ ! -s "$REL_APK" ]; then
            echo "ERROR: Release APK missing or empty"
            exit 1
          fi
          REL_BYTES=$(stat -c%s "$REL_APK")
          REL_MB=$(awk "BEGIN {printf \"%.2f\", $REL_BYTES/1048576}")
          REL_SHA256=$(sha256sum "$REL_APK" | awk '{print $1}')
          echo "release_apk_mb=$REL_MB" >> "$GITHUB_OUTPUT"
          echo "release_apk_sha256=$REL_SHA256" >> "$GITHUB_OUTPUT"

      - name: Clean temporary keystore
        if: always()
        run: rm -f "${{ runner.temp }}/release-upload.jks"

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: zehn-ai-debug-apk-v${{ steps.validate_debug.outputs.version_name }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Unit & Robolectric Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zehn-ai-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          retention-days: 30

      - name: Upload Signed Release APK artifact
        if: steps.signing_check.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: zehn-ai-release-apk-v${{ steps.validate_debug.outputs.version_name }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release on version tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          overwrite_files: false
          fail_on_unmatched_files: true
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            ${{ steps.signing_check.outputs.configured == 'true' && 'app/build/outputs/apk/release/app-release.apk' || '' }}

      - name: Write Build & APK Summary
        run: |
          {
            echo "## Zehn AI Build Summary"
            echo "- **Package**: \`com.zehn.assistant\`"
            echo "- **Version**: \`${{ steps.validate_debug.outputs.version_name }}\` (versionCode \`${{ steps.validate_debug.outputs.version_code }}\`)"
            echo "- **Build Date**: ${{ steps.validate_debug.outputs.build_date }}"
            echo "- **Debug APK Size**: ${{ steps.validate_debug.outputs.debug_apk_mb }} MB"
            echo "- **Debug APK SHA-256**: \`${{ steps.validate_debug.outputs.debug_apk_sha256 }}\`"
            if [ "${{ steps.signing_check.outputs.configured }}" = "true" ]; then
              echo "- **Release APK Size**: ${{ steps.build_release.outputs.release_apk_mb }} MB"
              echo "- **Release APK SHA-256**: \`${{ steps.build_release.outputs.release_apk_sha256 }}\`"
            else
              echo "- **Signed Release APK**: Skipped (configure \`RELEASE_KEYSTORE_BASE64\`, \`STORE_PASSWORD\`, \`KEY_PASSWORD\` secrets to enable)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
